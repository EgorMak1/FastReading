<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">FastReading: взаимодействие частей приложения</title>
  <desc id="desc">Диаграмма показывает MAUI-клиент, клиентские сервисы, ASP.NET Core API, JWT-авторизацию, Entity Framework Core и PostgreSQL.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#ea580c"/>
    </marker>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; filter: url(#shadow); }
      .panel-title { font: 700 30px "Segoe UI", Arial, sans-serif; fill: #0f172a; }
      .title { font: 800 46px "Segoe UI", Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 22px "Segoe UI", Arial, sans-serif; fill: #475569; }
      .box-title { font: 700 24px "Segoe UI", Arial, sans-serif; fill: #0f172a; }
      .box-text { font: 400 19px "Segoe UI", Arial, sans-serif; fill: #334155; }
      .small { font: 400 17px "Segoe UI", Arial, sans-serif; fill: #475569; }
      .label { font: 700 18px "Segoe UI", Arial, sans-serif; fill: #1e293b; }
      .box { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; }
      .ui { fill: #eff6ff; stroke: #60a5fa; }
      .service { fill: #ecfdf5; stroke: #34d399; }
      .api { fill: #fff7ed; stroke: #fb923c; }
      .db { fill: #f5f3ff; stroke: #a78bfa; }
      .storage { fill: #f1f5f9; stroke: #64748b; }
      .arrow-blue { fill: none; stroke: #2563eb; stroke-width: 4; marker-end: url(#arrow-blue); }
      .arrow-green { fill: none; stroke: #16a34a; stroke-width: 4; marker-end: url(#arrow-green); }
      .arrow-orange { fill: none; stroke: #ea580c; stroke-width: 4; marker-end: url(#arrow-orange); }
      .arrow-muted { fill: none; stroke: #64748b; stroke-width: 3; stroke-dasharray: 9 7; marker-end: url(#arrow-blue); }
    </style>
  </defs>

  <rect class="bg" width="1920" height="1080"/>

  <text class="title" x="80" y="76">FastReading: взаимодействие частей приложения</text>
  <text class="subtitle" x="80" y="114">Клиент MAUI отправляет данные тренировок и получает профиль через ASP.NET Core API, данные хранятся в PostgreSQL.</text>

  <rect class="panel" x="60" y="150" width="760" height="820" rx="20"/>
  <text class="panel-title" x="90" y="196">MAUI-клиент: MauiApp1</text>

  <rect class="box ui" x="90" y="230" width="310" height="110" rx="16"/>
  <text class="box-title" x="118" y="270">Экраны входа</text>
  <text class="box-text" x="118" y="302">LoginPage / RegisterPage</text>

  <rect class="box ui" x="470" y="230" width="310" height="110" rx="16"/>
  <text class="box-title" x="498" y="270">Главный экран</text>
  <text class="box-text" x="498" y="302">MainPage, дашборд</text>

  <rect class="box ui" x="90" y="390" width="310" height="138" rx="16"/>
  <text class="box-title" x="118" y="430">Тренировки</text>
  <text class="box-text" x="118" y="462">Шульте, бегущие слова</text>
  <text class="box-text" x="118" y="492">поле зрения, стирание слов</text>

  <rect class="box ui" x="470" y="390" width="310" height="138" rx="16"/>
  <text class="box-title" x="498" y="430">Статистика и профиль</text>
  <text class="box-text" x="498" y="462">SelectionStatisticsPage</text>
  <text class="box-text" x="498" y="492">ProfilePage</text>

  <rect class="box service" x="90" y="595" width="210" height="110" rx="16"/>
  <text class="box-title" x="118" y="635">AuthService</text>
  <text class="box-text" x="118" y="667">JWT, вход</text>

  <rect class="box service" x="325" y="595" width="210" height="110" rx="16"/>
  <text class="box-title" x="353" y="635">StatisticsService</text>
  <text class="box-text" x="353" y="667">результаты</text>

  <rect class="box service" x="560" y="595" width="220" height="110" rx="16"/>
  <text class="box-title" x="588" y="635">ProfileService</text>
  <text class="box-text" x="588" y="667">сводка профиля</text>

  <rect class="box storage" x="90" y="770" width="310" height="118" rx="16"/>
  <text class="box-title" x="118" y="810">SecureStorage</text>
  <text class="box-text" x="118" y="842">access_token</text>

  <rect class="box service" x="470" y="770" width="310" height="118" rx="16"/>
  <text class="box-title" x="498" y="810">ApiClient / HttpClient</text>
  <text class="box-text" x="498" y="842">http://159.194.232.38:8080</text>

  <rect class="panel" x="1090" y="150" width="770" height="820" rx="20"/>
  <text class="panel-title" x="1120" y="196">Сервер: FastReading.Server</text>

  <rect class="box api" x="1120" y="230" width="330" height="112" rx="16"/>
  <text class="box-title" x="1148" y="270">JWT middleware</text>
  <text class="box-text" x="1148" y="302">проверка Bearer-токена</text>

  <rect class="box api" x="1510" y="230" width="310" height="112" rx="16"/>
  <text class="box-title" x="1538" y="270">AuthController</text>
  <text class="box-text" x="1538" y="302">register / login</text>

  <rect class="box api" x="1120" y="400" width="330" height="126" rx="16"/>
  <text class="box-title" x="1148" y="440">StatisticsController</text>
  <text class="box-text" x="1148" y="472">сохранение и чтение</text>
  <text class="box-text" x="1148" y="502">результатов упражнений</text>

  <rect class="box api" x="1510" y="400" width="310" height="126" rx="16"/>
  <text class="box-title" x="1538" y="440">ProfileController</text>
  <text class="box-text" x="1538" y="472">дашборд, активность</text>
  <text class="box-text" x="1538" y="502">и рекомендации</text>

  <rect class="box api" x="1120" y="590" width="700" height="110" rx="16"/>
  <text class="box-title" x="1148" y="630">AppDbContext + Entity Framework Core</text>
  <text class="box-text" x="1148" y="662">единая точка доступа контроллеров к PostgreSQL</text>

  <rect class="box db" x="1120" y="770" width="160" height="90" rx="16"/>
  <text class="box-title" x="1148" y="812">Users</text>

  <rect class="box db" x="1310" y="770" width="210" height="90" rx="16"/>
  <text class="box-title" x="1338" y="812">TrainingResults</text>

  <rect class="box db" x="1550" y="750" width="270" height="130" rx="16"/>
  <text class="box-title" x="1578" y="792">Exercise results</text>
  <text class="box-text" x="1578" y="824">RunningWords, Shulte,</text>
  <text class="box-text" x="1578" y="854">FieldOfView, WordErasing</text>

  <rect class="box db" x="1245" y="885" width="360" height="72" rx="16"/>
  <text class="box-title" x="1273" y="930">UserExerciseProgresses</text>

  <path class="arrow-green" d="M 245 340 L 195 595"/>
  <path class="arrow-green" d="M 625 340 L 670 595"/>
  <path class="arrow-green" d="M 245 528 L 430 595"/>
  <path class="arrow-green" d="M 625 528 L 670 595"/>
  <path class="arrow-green" d="M 195 705 L 245 770"/>
  <path class="arrow-green" d="M 300 650 L 325 650"/>
  <path class="arrow-green" d="M 535 650 L 560 650"/>
  <path class="arrow-green" d="M 670 705 L 625 770"/>

  <path class="arrow-blue" d="M 780 830 C 900 830, 960 286, 1120 286"/>
  <text class="label" x="854" y="520">HTTP + JSON</text>

  <path class="arrow-orange" d="M 780 850 C 905 900, 950 286, 1510 286"/>
  <text class="label" x="870" y="742">login/register</text>

  <path class="arrow-blue" d="M 1285 342 L 1285 400"/>

  <path class="arrow-orange" d="M 1665 342 C 1785 410, 1785 555, 1620 590"/>
  <path class="arrow-blue" d="M 1285 526 L 1285 590"/>
  <path class="arrow-blue" d="M 1665 526 C 1665 560, 1570 590, 1470 590"/>

  <path class="arrow-blue" d="M 1200 700 L 1200 770"/>
  <path class="arrow-blue" d="M 1415 700 L 1415 770"/>
  <path class="arrow-blue" d="M 1685 700 L 1685 750"/>
  <path class="arrow-blue" d="M 1425 700 L 1425 885"/>

  <rect x="80" y="1005" width="1760" height="42" rx="12" fill="#e2e8f0"/>
  <text class="small" x="105" y="1032">Ключевая логика: AuthService получает JWT, StatisticsService сохраняет результаты тренировок, ProfileService получает агрегированный профиль; сервер через AppDbContext читает и пишет данные пользователя в PostgreSQL.</text>
</svg>
