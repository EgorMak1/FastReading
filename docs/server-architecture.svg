<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Схема работы серверной части FastReading</title>
  <desc id="desc">Упрощенная слоистая схема серверной части перед сдачей ВКР: клиент, API, контроллеры, DTO-контракты, модели, EF Core и PostgreSQL.</desc>
  <defs>
    <style>
      .bg { fill: #f7f9fb; }
      .server { fill: #ffffff; stroke: #1f2937; stroke-width: 2.5; }
      .client { fill: #e0f2fe; stroke: #0369a1; stroke-width: 2; }
      .api { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; }
      .logic { fill: #ecfdf5; stroke: #047857; stroke-width: 2; }
      .data { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; }
      .db { fill: #fef2f2; stroke: #b91c1c; stroke-width: 2; }
      .note { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
      .title { font: 700 34px Arial, sans-serif; fill: #111827; }
      .subtitle { font: 400 19px Arial, sans-serif; fill: #475569; }
      .label { font: 700 21px Arial, sans-serif; fill: #111827; }
      .small { font: 400 16px Arial, sans-serif; fill: #334155; }
      .tiny { font: 400 14px Arial, sans-serif; fill: #475569; }
      .layer { font: 700 16px Arial, sans-serif; fill: #334155; text-transform: uppercase; letter-spacing: 0; }
      .arrow { stroke: #334155; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead); }
      .arrow-light { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrowheadLight); }
      .assoc { stroke: #64748b; stroke-width: 2; fill: none; stroke-dasharray: 7 6; }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#334155" />
    </marker>
    <marker id="arrowheadLight" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="920" />

  <text class="title" x="70" y="70">Как работает серверная часть FastReading</text>
  <text class="subtitle" x="70" y="104">Текущий безопасный вариант перед сдачей ВКР: упрощенная слоистая архитектура без полного рефакторинга.</text>

  <rect class="client" x="70" y="210" width="250" height="150" rx="8" />
  <text class="layer" x="100" y="246">КЛИЕНТ</text>
  <text class="label" x="100" y="282">MAUI-приложение</text>
  <text class="small" x="100" y="315">Отправляет JSON-запросы</text>
  <text class="small" x="100" y="340">на REST API сервера</text>

  <rect class="server" x="390" y="150" width="720" height="610" rx="12" />
  <text class="layer" x="430" y="190">СЕРВЕР FASTREADING.SERVER</text>
  <text class="tiny" x="430" y="218">ASP.NET Core Web API, JWT, EF Core</text>

  <rect class="api" x="430" y="255" width="300" height="120" rx="8" />
  <text class="layer" x="460" y="288">HOST / API PIPELINE</text>
  <text class="label" x="460" y="322">Program.cs</text>
  <text class="small" x="460" y="348">DI, JWT, Controllers, OpenAPI</text>

  <rect class="api" x="770" y="255" width="300" height="120" rx="8" />
  <text class="layer" x="800" y="288">PRESENTATION</text>
  <text class="label" x="800" y="322">Controllers</text>
  <text class="small" x="800" y="348">Auth, Profile, Statistics, Health</text>

  <rect class="logic" x="430" y="420" width="300" height="140" rx="8" />
  <text class="layer" x="460" y="453">CONTRACTS</text>
  <text class="label" x="460" y="488">DTO-форматы JSON</text>
  <text class="small" x="460" y="515">Описание Request / Response</text>
  <text class="small" x="460" y="540">Не являются этапом потока</text>

  <rect class="logic" x="770" y="420" width="300" height="140" rx="8" />
  <text class="layer" x="800" y="453">APPLICATION LOGIC</text>
  <text class="label" x="800" y="488">Пока внутри Controllers</text>
  <text class="small" x="800" y="515">Регистрация, профиль, статистика</text>
  <text class="small" x="800" y="540">расчет очков и прогресса</text>

  <rect class="data" x="430" y="605" width="300" height="120" rx="8" />
  <text class="layer" x="460" y="638">DOMAIN / MODELS</text>
  <text class="label" x="460" y="672">Entities</text>
  <text class="small" x="460" y="698">User, TrainingResult, Progress</text>

  <rect class="data" x="770" y="605" width="300" height="120" rx="8" />
  <text class="layer" x="800" y="638">PERSISTENCE</text>
  <text class="label" x="800" y="672">AppDbContext</text>
  <text class="small" x="800" y="698">DbSet, связи, индексы, Migrations</text>

  <rect class="db" x="1180" y="500" width="170" height="150" rx="8" />
  <text class="layer" x="1210" y="538">DATABASE</text>
  <text class="label" x="1210" y="574">PostgreSQL</text>
  <text class="small" x="1210" y="606">Хранит пользователей</text>
  <text class="small" x="1210" y="631">и результаты</text>

  <path class="arrow" d="M 320 285 L 422 285" />
  <text class="tiny" x="330" y="267">HTTP / JSON</text>

  <path class="arrow-light" d="M 730 315 L 762 315" />
  <path class="arrow-light" d="M 920 375 L 920 412" />
  <path class="arrow-light" d="M 920 560 L 920 597" />
  <path class="assoc" d="M 770 665 L 738 665" />
  <text class="tiny" x="732" y="646">EF Core работает с Entities</text>
  <path class="arrow" d="M 1070 665 C 1130 665 1130 575 1172 575" />

  <rect class="note" x="70" y="430" width="250" height="220" rx="8" />
  <text class="layer" x="100" y="466">ПОТОК ЗАПРОСА</text>
  <text class="small" x="100" y="501">1. Клиент вызывает API</text>
  <text class="small" x="100" y="531">2. JWT проверяет доступ</text>
  <text class="small" x="100" y="561">3. Controller обрабатывает</text>
  <text class="small" x="100" y="591">4. EF Core читает / пишет</text>
  <text class="small" x="100" y="621">5. Сервер возвращает JSON</text>

  <text class="tiny" x="70" y="795">Схема отражает текущую серверную часть без рискованного полного рефакторинга перед защитой.</text>
</svg>
