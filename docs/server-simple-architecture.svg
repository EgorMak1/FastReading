<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">Схема серверной части FastReading</title>
  <desc id="desc">Упрощенная схема серверной части проекта FastReading: клиентское приложение, ASP.NET Core API, контроллеры, AppDbContext, модели и PostgreSQL.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .group { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .client { fill: #e0f2fe; stroke: #0369a1; stroke-width: 2; }
      .api { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; }
      .ctrl { fill: #ecfdf5; stroke: #047857; stroke-width: 2; }
      .data { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; }
      .db { fill: #fef2f2; stroke: #b91c1c; stroke-width: 2; }
      .title { font: 700 34px Arial, sans-serif; fill: #111827; }
      .subtitle { font: 400 18px Arial, sans-serif; fill: #475569; }
      .section { font: 700 22px Arial, sans-serif; fill: #111827; }
      .label { font: 700 19px Arial, sans-serif; fill: #111827; }
      .small { font: 400 15px Arial, sans-serif; fill: #334155; }
      .tiny { font: 400 13px Arial, sans-serif; fill: #475569; }
      .arrow { stroke: #334155; stroke-width: 2.6; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#334155" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="620" />

  <text class="title" x="60" y="68">Схема серверной части FastReading</text>
  <text class="subtitle" x="60" y="100">Структура построена на основе текущего проекта: ASP.NET Core Web API, Entity Framework Core и PostgreSQL.</text>

  <rect class="group" x="50" y="140" width="1300" height="410" rx="12" />
  <text class="section" x="80" y="178">Основные компоненты</text>

  <rect class="client" x="90" y="250" width="210" height="120" rx="8" />
  <text class="label" x="120" y="288">Клиентское приложение</text>
  <text class="small" x="120" y="320">.NET MAUI</text>
  <text class="small" x="120" y="344">HTTP-запросы к API</text>

  <rect class="api" x="370" y="250" width="220" height="120" rx="8" />
  <text class="label" x="405" y="288">ASP.NET Core API</text>
  <text class="small" x="405" y="320">Program.cs</text>
  <text class="small" x="405" y="344">Маршрутизация, JWT, DI</text>

  <rect class="ctrl" x="660" y="220" width="260" height="180" rx="8" />
  <text class="label" x="735" y="258">Контроллеры</text>
  <text class="small" x="690" y="292">AuthController</text>
  <text class="small" x="690" y="318">ProfileController</text>
  <text class="small" x="690" y="344">StatisticsController</text>
  <text class="small" x="690" y="370">HealthController</text>

  <rect class="data" x="990" y="220" width="220" height="180" rx="8" />
  <text class="label" x="1030" y="258">AppDbContext</text>
  <text class="small" x="1020" y="292">Entity Framework Core</text>
  <text class="small" x="1020" y="318">DbSet и конфигурация</text>
  <text class="small" x="1020" y="344">доступа к данным</text>

  <rect class="data" x="660" y="440" width="260" height="80" rx="8" />
  <text class="label" x="760" y="474">Модели</text>
  <text class="small" x="690" y="500">User, TrainingResult, UserExerciseProgress и др.</text>

  <rect class="db" x="990" y="440" width="220" height="80" rx="8" />
  <text class="label" x="1038" y="474">База данных</text>
  <text class="small" x="1045" y="500">PostgreSQL</text>

  <path class="arrow" d="M 300 310 L 362 310" />
  <text class="tiny" x="305" y="296">HTTP / JSON</text>

  <path class="arrow" d="M 590 310 L 652 310" />
  <text class="tiny" x="603" y="296">вызов API</text>

  <path class="arrow" d="M 920 310 L 982 310" />
  <text class="tiny" x="933" y="296">запрос к данным</text>

  <path class="arrow" d="M 1100 400 L 1100 432" />
  <text class="tiny" x="1110" y="420">SQL</text>

  <path class="arrow" d="M 980 480 L 928 480" />
  <text class="tiny" x="936" y="466">сущности</text>

  <text class="tiny" x="80" y="580">AppDbContext представляет слой доступа к данным, а модели являются сущностями предметной области, используемыми в этом слое.</text>
</svg>
