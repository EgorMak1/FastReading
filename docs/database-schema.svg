<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Схема базы данных FastReading</title>
  <desc id="desc">Структура базы данных приложения FastReading на основе моделей Entity Framework Core и конфигурации AppDbContext.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #334155; stroke-width: 2; }
      .user { fill: #e0f2fe; stroke: #0369a1; stroke-width: 2.2; }
      .result { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; }
      .progress { fill: #ecfdf5; stroke: #047857; stroke-width: 2; }
      .title { font: 700 34px Arial, sans-serif; fill: #111827; }
      .subtitle { font: 400 18px Arial, sans-serif; fill: #475569; }
      .tbl { font: 700 19px Arial, sans-serif; fill: #111827; }
      .field { font: 400 14px Arial, sans-serif; fill: #334155; }
      .note { font: 400 13px Arial, sans-serif; fill: #475569; }
      .line { stroke: #334155; stroke-width: 2.2; fill: none; marker-end: url(#arrowhead); }
      .rel { font: 400 13px Arial, sans-serif; fill: #334155; }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#334155" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="980" />

  <text class="title" x="60" y="65">Схема базы данных FastReading</text>
  <text class="subtitle" x="60" y="98">Построена по моделям [Models] и конфигурации [AppDbContext](C:/Users/makar/Desktop/FastReading/FastReading.Server/Data/AppDbContext.cs).</text>

