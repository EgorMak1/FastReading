  <rect class="result" x="860" y="670" width="360" height="185" rx="8" />
  <text class="tbl" x="975" y="705">WordErasingResults</text>
  <text class="field" x="885" y="738">PK  Id : Guid</text>
  <text class="field" x="885" y="763">FK  UserId : Guid</text>
  <text class="field" x="885" y="788">TextId : string(100)</text>
  <text class="field" x="885" y="813">TextTitle : string(200)</text>
  <text class="field" x="885" y="838">SpeedBeforeWpm / SpeedAfterWpm : int</text>
  <text class="field" x="885" y="863">AccuracyPercent : double</text>

  <path class="line" d="M 700 300 L 300 380" />
  <text class="rel" x="440" y="330">1 : N по UserId</text>

  <path class="line" d="M 760 300 L 630 380" />
  <text class="rel" x="655" y="335">1 : N по UserId</text>

  <path class="line" d="M 840 300 L 960 380" />
  <text class="rel" x="860" y="335">1 : N по UserId</text>

  <path class="line" d="M 900 300 L 1280 380" />
  <text class="rel" x="1110" y="330">1 : N по UserId</text>

  <path class="line" d="M 720 300 L 560 670" />
  <text class="rel" x="590" y="510">1 : N по UserId</text>

  <path class="line" d="M 880 300 L 1040 670" />
  <text class="rel" x="960" y="510">1 : N по UserId</text>

  <text class="note" x="60" y="925">Во всех дочерних таблицах настроен внешний ключ UserId с каскадным удалением.</text>
  <text class="note" x="60" y="948">На схеме показаны ключевые поля и ограничения; часть вспомогательных полей опущена для компактности.</text>
