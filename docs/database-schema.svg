  <text class="field" x="855" y="523">LevelBefore / LevelAfter : int</text>
  <text class="field" x="855" y="548">Score : double</text>

  <rect class="result" x="1180" y="380" width="300" height="175" rx="8" />
  <text class="tbl" x="1270" y="415">FieldOfViewResults</text>
